# This origin is published only on the host loopback interface. Cloudflare
# Tunnel provides public HTTPS; never expose this HTTP port on a public NIC.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_cf_connecting_ip $trusted_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

upstream django_app {
    zone django_app 64k;
    server web:8000 resolve;
    keepalive 32;
}

limit_req_zone $trusted_client_ip zone=app:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    server_name venepheth.online www.venepheth.online;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://cdn.tailwindcss.com;" always;

    client_max_body_size 100M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/media/(resources/|publications/|courses/resources/|assistant/knowledge/) {
        deny all;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    location /protected-media/ {
        internal;
        alias /app/media/;
    }

    location /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_client_ip;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        limit_req zone=app burst=20 nodelay;
    }
}
