# =============================================================================
# Nginx Production Config for Venepheth SAYAVONG Academic Platform
# Handles: HTTP → HTTPS redirect, SSL termination, static/media, security headers
# =============================================================================

# Upstream Gunicorn (Django)
upstream django_app {
    # Round-robin across multiple web container replicas
    server web:8000;
    keepalive 32;
}

# ─── HTTP → HTTPS Redirect & ACME Challenge ───────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS Server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ── SSL Certificates (Let's Encrypt) ──────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;

    # ── Client / Upload Limits ────────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ── Static Files ──────────────────────────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Media Files ───────────────────────────────────────────────────────────
    # NOTE: permission-gated file paths are denied here and served only via
    # Django download views (X-Accel-Redirect → /protected-media/).
    location ~ ^/media/(resources/|publications/|courses/resources/) {
        deny all;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    # ── Protected Media (internal — Django X-Accel-Redirect only) ─────────────
    location /protected-media/ {
        internal;
        alias /app/media/;
    }

    # ── Favicon ───────────────────────────────────────────────────────────────
    location /favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # ── Django App ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Rate limiting
        limit_req zone=app burst=20 nodelay;
    }
}

# ─── Rate Limiting Zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=app:10m rate=10r/s;
