upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Media files
    # NOTE: permission-gated paths are denied (served via Django download views).
    location ~ ^/media/(resources/|publications/|courses/resources/|assistant/knowledge/) {
        deny all;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Prevent script execution from media directory
        location ~* \.(php|php5|cgi|pl|py|sh)$ {
            deny all;
        }
    }

    # Protected media (internal — Django X-Accel-Redirect only)
    location /protected-media/ {
        internal;
        alias /app/media/;
    }

    # Django app
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
    }

    # Health check endpoint (no logging).
    # The proxy_set_header lines must match the main location above: without
    # them nginx sends the upstream name as the Host header ("django"), which
    # is not in ALLOWED_HOSTS, so Django answers 400 DisallowedHost instead of
    # 200 and /health/ is unusable through the proxy.
    location /health/ {
        proxy_pass http://django/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        access_log off;
    }
}
