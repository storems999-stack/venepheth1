[project]
name = "venepheth-platform"
version = "0.1.0"
description = "Venepheth SAYAVONG Academic Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "my-worker",
    "**/migrations/**",
    "static",
    "media",
    "node_modules",
]

[tool.ruff.lint]
# RUF012: Django Model/Form Meta `fields` / `widgets` lists are idiomatic mutable defaults.
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402"]
"scripts/setup_profile_and_icons.py" = ["E402"]
"tests/**" = ["S101", "BLE001", "S110"]
"**/management/commands/**" = ["BLE001", "S110"]
# Defensive optional-import / audit hooks — must not break request flow
"apps/**" = ["BLE001", "S110"]
"config/settings/testing.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
