# ─── Shared Configuration ─────────────────────────────────────────────────────
x-django-common: &django-common
  # CI pushes to GHCR and the deploy workflow exports VENEPHETH_IMAGE as the
  # immutable digest for the exact build. The literal below is only the local
  # fallback for `docker compose build` on the server; without the variable the
  # server would pull a tag that was never published and keep the old image.
  image: ${VENEPHETH_IMAGE:-venepheth_platform:prod}
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  env_file:
    - .env.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media_vol:/app/media
    - static_vol:/app/staticfiles
    - logs_vol:/app/logs
    - backups_vol:/app/backups

# ─── Services ────────────────────────────────────────────────────────────────
services:
  # ── Django (Gunicorn) ───────────────────────────────────────────────────────
  web:
    <<: *django-common
    command: >
      gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 4
        --worker-class gthread
        --threads 2
        --timeout 120
        --access-logfile -
        --error-logfile -
        --log-level warning
    ports: []  # No direct port exposure; Nginx is the entry point
    # Standalone Compose runs one container. It does not perform Swarm-style
    # rolling updates; deployment recreates this service and may briefly interrupt requests.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx (Reverse Proxy & SSL) ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_vol:/app/staticfiles:ro
      - media_vol:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

  # ── Certbot (Let's Encrypt SSL) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery:
    <<: *django-common
    command: celery -A config worker --loglevel=warning --concurrency=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Celery Beat (Scheduler) ──────────────────────────────────────────────────
  celery-beat:
    <<: *django-common
    command: celery -A config beat --loglevel=warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  media_vol:
  static_vol:
  logs_vol:
  backups_vol:
  certbot_www:
  certbot_conf:
