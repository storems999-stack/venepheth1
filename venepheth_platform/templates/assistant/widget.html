{% load static i18n %}
{# AI Academic Assistant Floating Widget — included in base.html #}
<div id="ai-assistant-widget"
     x-data="assistantWidget()"
     class="fixed bottom-6 right-6 z-50"
     x-cloak>

    <!-- Floating Button -->
    <button
        @click="toggle()"
        id="ai-widget-toggle"
        class="w-14 h-14 bg-gold-500 hover:bg-gold-400 text-navy-950 rounded-full shadow-2xl shadow-gold-500/30 flex items-center justify-center transition-all duration-300 hover:scale-110 focus:outline-none focus:ring-2 focus:ring-gold-400 focus:ring-offset-2 focus:ring-offset-navy-950"
        :title="open ? 'Close AI Assistant' : 'Ask AI Academic Assistant'">
        <span x-show="!open" class="font-bold text-sm select-none">AI</span>
        <i data-lucide="x" class="w-5 h-5" x-show="open"></i>
    </button>

    <!-- Notification badge -->
    <span x-show="!open && hasNewMessage"
          class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full border-2 border-navy-950 animate-pulse"></span>

    <!-- Widget Panel -->
    <div x-show="open"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-90 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-90 translate-y-4"
         class="absolute bottom-16 right-0 w-80 sm:w-96 glass border border-white/10 rounded-2xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 bg-navy-900/80">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 rounded-lg overflow-hidden flex items-center justify-center ring-1 ring-gold-500/40 shrink-0">
                    <img src="{% static 'icons/favicon-32x32.png' %}" alt="VS" class="w-full h-full object-cover">
                </div>
                <div>
                    <p class="text-white text-sm font-semibold">AI Assistant</p>
                    <div class="flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 bg-green-400 rounded-full"></span>
                        <p class="text-green-400 text-xs">Online</p>
                    </div>
                </div>
            </div>
            <a href="/assistant/"
               class="text-xs text-gold-400 hover:text-gold-300 border border-gold-500/30 px-2 py-1 rounded-lg hover:bg-gold-500/10 transition-all">
                Open Full ↗
            </a>
        </div>

        <!-- Messages -->
        <div class="h-56 overflow-y-auto p-4 space-y-3 scroll-smooth" x-ref="widgetMessages">
            <div class="bg-navy-800/60 rounded-xl rounded-tl-none px-3 py-2">
                <p class="text-gray-300 text-xs leading-relaxed">
                    How can I help? Ask about courses, research, or office hours.
                </p>
            </div>
            <template x-for="msg in widgetMessages" :key="msg.id">
                <div>
                    <div x-show="msg.role==='user'" class="flex justify-end">
                        <div class="bg-gold-500/20 border border-gold-500/30 rounded-xl rounded-tr-none px-3 py-2 max-w-[85%]">
                            <p class="text-white text-xs" x-text="msg.content"></p>
                        </div>
                    </div>
                    <div x-show="msg.role==='assistant'" class="flex">
                        <div class="bg-navy-800/60 rounded-xl rounded-tl-none px-3 py-2 max-w-[85%]">
                            <div class="text-gray-300 text-xs leading-relaxed" x-html="msg.html"></div>
                        </div>
                    </div>
                    <div x-show="msg.role==='typing'" class="flex">
                        <div class="bg-navy-800/60 rounded-xl rounded-tl-none px-3 py-2">
                            <div class="flex space-x-1">
                                <span class="w-1.5 h-1.5 bg-gold-400 rounded-full animate-bounce [animation-delay:-0.3s]"></span>
                                <span class="w-1.5 h-1.5 bg-gold-400 rounded-full animate-bounce [animation-delay:-0.15s]"></span>
                                <span class="w-1.5 h-1.5 bg-gold-400 rounded-full animate-bounce"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Input -->
        <div class="border-t border-white/5 p-3">
            <form @submit.prevent="sendWidgetMessage()" class="flex space-x-2">
                <input type="text" x-model="widgetHp" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none !important; position:absolute !important; left:-9999px !important;">
                <input
                    x-model="widgetInput"
                    type="text"
                    maxlength="300"
                    placeholder="Type your question..."
                    class="flex-1 bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-gold-500 transition-colors"
                    :disabled="widgetLoading">
                <button
                    type="submit"
                    :disabled="widgetLoading || !widgetInput.trim()"
                    class="bg-gold-500 hover:bg-gold-400 disabled:opacity-40 text-navy-950 px-3 py-2 rounded-lg transition-all">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script nonce="{{ request.csp_nonce }}">
function assistantWidget() {
    return {
        open: false,
        hasNewMessage: false,
        widgetMessages: [],
        widgetInput: '',
        widgetHp: '',
        widgetLoadedAt: Date.now(),
        widgetLoading: false,
        msgCounter: 0,

        toggle() {
            this.open = !this.open;
            if (this.open) {
                this.hasNewMessage = false;
                this.$nextTick(() => this.scrollToBottom());
            }
        },

        async sendWidgetMessage() {
            const query = this.widgetInput.trim();
            if (!query || this.widgetLoading) return;

            this.widgetInput = '';
            this.widgetLoading = true;
            this.widgetMessages.push({ id: ++this.msgCounter, role: 'user', content: query });

            const typingId = ++this.msgCounter;
            this.widgetMessages.push({ id: typingId, role: 'typing' });
            this.$nextTick(() => this.scrollToBottom());

            try {
                const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value
                    || this.getCookie('csrftoken');
                const resp = await fetch('/assistant/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ query, language: document.documentElement.lang || 'en', website_url_hp: this.widgetHp || '', loaded_at: this.widgetLoadedAt }),
                });
                const data = await resp.json();
                this.widgetMessages = this.widgetMessages.filter(m => m.id !== typingId);
                this.widgetMessages.push({
                    id: ++this.msgCounter,
                    role: 'assistant',
                    content: data.answer || data.error,
                    html: this.toHtml(data.answer || data.error || 'Error'),
                });
                if (!this.open) { this.hasNewMessage = true; }
            } catch {
                this.widgetMessages = this.widgetMessages.filter(m => m.id !== typingId);
                this.widgetMessages.push({ id: ++this.msgCounter, role: 'assistant', content: 'Network error.', html: '<p>Network error.</p>' });
            } finally {
                this.widgetLoading = false;
                this.$nextTick(() => { this.scrollToBottom(); if (window.lucide) lucide.createIcons(); });
            }
        },

        scrollToBottom() {
            const el = this.$refs.widgetMessages;
            if (el) el.scrollTop = el.scrollHeight;
        },

        toHtml(md) {
            // Escape raw HTML first (answers may echo user input),
            // then allow only http(s)/relative link targets.
            // Double quotes MUST be escaped too: link URLs are interpolated into
            // href="…", so an unescaped " closes the attribute and injects a
            // live event handler (e.g. [a](https://x/" onmouseover=alert`1`)).
            if (!md) return '';
            const escaped = md
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
            return escaped
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, url) => {
                    const safe = /^(https?:\/\/|\/)/.test(url) ? url : '#';
                    return `<a href="${safe}" target="_blank" rel="noopener">${text}</a>`;
                })
                .replace(/\n/g, '<br>');
        },

        getCookie(name) {
            const m = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
            return m ? decodeURIComponent(m[2]) : '';
        },
    };
}
</script>
