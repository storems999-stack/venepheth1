{% extends "account/base.html" %}
{% load i18n %}

{% block title %}{% trans "Account Inactive" %}{% endblock %}

{% block account_content %}
<div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-red-500/10 text-red-400 mb-6">
        <i data-lucide="user-x" class="w-6 h-6"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">{% trans "Account Inactive" %}</h1>
    <p class="text-gray-400 text-sm">
        {% trans "This account is inactive." %}
    </p>
</div>

<div class="mt-8 text-center border-t border-white/5 pt-6">
    <a href="{% url 'contact:form' %}" class="text-sm font-medium text-gold-400 hover:text-gold-300 transition-colors">
        {% trans "Contact the site administrator" %}
    </a>
</div>
{% endblock %}
