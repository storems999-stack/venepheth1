{% extends "account/base.html" %}
{% load i18n %}

{% block title %}{% trans "Sign Out" %}{% endblock %}

{% block account_content %}
<div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gold-500/10 text-gold-400 mb-6">
        <i data-lucide="log-out" class="w-6 h-6"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">{% trans "Sign Out" %}</h1>
    <p class="text-gray-400 text-sm">
        {% trans "Are you sure you want to sign out?" %}
    </p>
</div>

<form method="POST" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {{ redirect_field }}
    <button type="submit" class="w-full bg-gold-500 hover:bg-gold-400 text-navy-950 font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-gold-500/20">
        {% trans "Sign Out" %}
    </button>
</form>

<div class="mt-6 text-center">
    <a href="{% url 'core:home' %}" class="text-sm text-gray-400 hover:text-gray-200 transition-colors">
        {% trans "Cancel" %}
    </a>
</div>
{% endblock %}
