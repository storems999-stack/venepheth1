{% extends "account/base.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password" %}{% endblock %}

{% block account_content %}
<div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-6">
        <i data-lucide="check-circle" class="w-6 h-6"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">{% trans "Change Password" %}</h1>
    <p class="text-gray-400 text-sm">
        {% trans "Your password is now changed." %}
    </p>
</div>

<a href="{% url 'account_login' %}" class="block w-full text-center bg-gold-500 hover:bg-gold-400 text-navy-950 font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-gold-500/20">
    {% trans "Sign In" %}
</a>
{% endblock %}
