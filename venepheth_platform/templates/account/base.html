{% extends "base.html" %}

{% block content %}
<section class="min-h-[80vh] flex items-center justify-center bg-navy-950 py-20 relative overflow-hidden">
    <div class="absolute inset-0 bg-grid"></div>
    <!-- Decorative blobs -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-gold-500/5 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-navy-500/5 rounded-full blur-3xl"></div>
    
    <div class="relative w-full max-w-md mx-auto px-4 sm:px-6 z-10">
        <div class="glass border border-white/5 shadow-2xl shadow-black/50 rounded-2xl p-8 sm:p-10">
            {% block account_content %}{% endblock %}
        </div>
    </div>
</section>
{% endblock %}
