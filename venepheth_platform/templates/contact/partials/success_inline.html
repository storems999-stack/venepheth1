{% load i18n %}
<div class="glass rounded-2xl p-8 border border-green-500/30 text-center space-y-4">
    <div class="w-16 h-16 bg-green-500/10 border border-green-500/30 rounded-2xl flex items-center justify-center mx-auto">
        <i data-lucide="check-circle" class="w-8 h-8 text-green-400"></i>
    </div>
    <h3 class="text-2xl font-serif font-bold text-white">{% trans "Message Sent Successfully!" %}</h3>
    <p class="text-gray-300 max-w-md mx-auto leading-relaxed">
        {% trans "Thank you for reaching out. Your inquiry has been received and you will receive a response as soon as possible." %}
    </p>
    <div class="pt-4">
        <a href="{% url 'contact:form' %}" class="inline-flex items-center space-x-2 text-sm text-gold-400 hover:text-gold-300 transition-colors">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            <span>{% trans "Send another message" %}</span>
        </a>
    </div>
</div>
