{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Page Not Found" %}{% endblock %}
{% block content %}
<section class="bg-navy-950 min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-grid"></div>
    <div class="relative text-center max-w-lg mx-auto px-4">
        <div class="text-9xl font-serif font-bold gradient-text mb-6 leading-none">404</div>
        <h1 class="text-3xl font-bold text-white mb-4">{% trans "Page Not Found" %}</h1>
        <p class="text-gray-400 text-lg mb-10">{% trans "The page you are looking for doesn't exist or has been moved." %}</p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="{% url 'core:home' %}" class="inline-flex items-center space-x-2 bg-gold-500 hover:bg-gold-400 text-navy-950 font-semibold px-6 py-3 rounded-xl transition-all">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>{% trans "Go Home" %}</span>
            </a>
            <a href="{% url 'search:results' %}" class="inline-flex items-center space-x-2 border border-white/20 text-white hover:bg-white/5 px-6 py-3 rounded-xl transition-all">
                <i data-lucide="search" class="w-4 h-4"></i>
                <span>{% trans "Search" %}</span>
            </a>
        </div>
    </div>
</section>
{% endblock %}
