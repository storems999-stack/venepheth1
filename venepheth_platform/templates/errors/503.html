{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Service Unavailable" %}{% endblock %}
{% block content %}
<section class="bg-navy-950 min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="absolute inset-0 bg-grid"></div>
    <div class="relative text-center max-w-lg mx-auto px-4">
        <div class="text-9xl font-serif font-bold gradient-text mb-6 leading-none">503</div>
        <h1 class="text-3xl font-bold text-white mb-4">{% trans "Service Unavailable" %}</h1>
        <p class="text-gray-400 text-lg mb-10">{% trans "The server is temporarily unavailable. Please try again in a few minutes." %}</p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="{% url 'core:home' %}" class="inline-flex items-center space-x-2 bg-gold-500 hover:bg-gold-400 text-navy-950 font-semibold px-6 py-3 rounded-xl transition-all">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span>{% trans "Go Home" %}</span>
            </a>
            <button type="button" data-reload class="inline-flex items-center space-x-2 border border-white/20 text-white hover:bg-white/5 px-6 py-3 rounded-xl transition-all">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span>{% trans "Retry" %}</span>
            </button>
        </div>
    </div>
</section>
{% endblock %}
