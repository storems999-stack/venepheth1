name: CD — Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Must pass CI first ─────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      # Pin the CI conclusion to the exact commit being deployed. Deploying
      # merely because a push happened is how broken commits reach production.
      - name: Check CI status for this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status=$(gh run list \
              --repo "$REPO" \
              --workflow ci.yml \
              --json conclusion,headSha \
              --limit 20 \
              --jq "map(select(.headSha == \"$SHA\"))[0].conclusion // \"\"")
            if [ "$status" = "success" ]; then
              echo "CI passed for $SHA"
              echo "should-deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ] || [ "$status" = "timed_out" ]; then
              echo "::error::CI concluded '$status' for $SHA — aborting deploy"
              echo "should-deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "CI still running (attempt $attempt)..."
            sleep 60
          done
          echo "::error::CI did not finish in time — aborting deploy"
          echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          exit 1

  # ─── Build & Push Docker Image ──────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: wait-for-ci
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          IMAGE_REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: 'IMAGE_TAG,IMAGE_REPO,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH'
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/srv/venepheth}"

            # Pull latest compose file
            git pull origin main

            # IMAGE_TAG points compose at the image this run just pushed.
            # Without it the server pulls `venepheth_platform:prod`, which CI
            # never publishes, so the deploy silently kept the old image.
            VENEPHETH_IMAGE="ghcr.io/${IMAGE_REPO}:${IMAGE_TAG}"
            echo "Deploying ${VENEPHETH_IMAGE}"

            # Login so the private GHCR image can be pulled.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" docker compose -f docker-compose.prod.yml pull web

            # Run migrations
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" docker compose -f docker-compose.prod.yml run --rm web \
              python manage.py migrate --noinput

            # Collect static files
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" docker compose -f docker-compose.prod.yml run --rm web \
              python manage.py collectstatic --noinput

            # Rolling restart (zero-downtime)
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" docker compose -f docker-compose.prod.yml up -d --no-deps web celery

            # Health check against the app port directly. Port 80 answers 301
            # for every non-ACME path and `curl -f` does not treat 3xx as an
            # error, so probing it could never fail a bad deploy.
            echo "Waiting for the app to become healthy..."
            healthy=0
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8000/health/ >/dev/null 2>&1; then
                echo "✅  App healthy after ${attempt} attempt(s)"
                healthy=1
                break
              fi
              sleep 5
            done
            if [ "$healthy" -ne 1 ]; then
              echo "❌  Health check never passed"
              VENEPHETH_IMAGE="$VENEPHETH_IMAGE" docker compose -f docker-compose.prod.yml logs --tail=100 web
              exit 1
            fi

            # Renew certs ON THE DEPLOY HOST (this must run under ssh-action;
            # a plain `run:` step executes on the runner, where compose and
            # .env.prod do not exist).
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" docker compose -f docker-compose.prod.yml run --rm \
              certbot renew --quiet || true
            docker compose -f docker-compose.prod.yml exec nginx nginx -s reload || true

            echo "✅ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "🚨 Deployment failed for ${{ github.sha }}. Check logs."
