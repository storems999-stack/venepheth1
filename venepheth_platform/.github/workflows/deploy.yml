name: CD — Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  # ─── Must pass CI first ─────────────────────────────────────────────────────
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      # Pin the CI conclusion to the exact commit being deployed. Deploying
      # merely because a push happened is how broken commits reach production.
      - name: Check CI status for this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            status=$(gh run list \
              --repo "$REPO" \
              --workflow ci.yml \
              --json conclusion,headSha \
              --limit 20 \
              --jq "map(select(.headSha == \"$SHA\"))[0].conclusion // \"\"")
            if [ "$status" = "success" ]; then
              echo "CI passed for $SHA"
              echo "should-deploy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ] || [ "$status" = "timed_out" ]; then
              echo "::error::CI concluded '$status' for $SHA — aborting deploy"
              echo "should-deploy=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "CI still running (attempt $attempt)..."
            sleep 60
          done
          echo "::error::CI did not finish in time — aborting deploy"
          echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          exit 1

  # ─── Build & Push Docker Image ──────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: wait-for-ci
    outputs:
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/venepheth' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: 'IMAGE_REF,DEPLOY_SHA,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH'
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            # Use the compose/config files from the same commit as the image.
            git fetch --no-tags origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"

            # Deploy by immutable digest so the exact image built by this run
            # is used, independent of mutable branch or latest tags.
            VENEPHETH_IMAGE="$IMAGE_REF"
            echo "Deploying ${VENEPHETH_IMAGE}"

            # Login so the private GHCR image can be pulled.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            compose() {
              docker compose --env-file .env.prod \
                -f docker-compose.prod.yml -f docker-compose.tunnel.yml "$@"
            }
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" compose pull web celery celery-beat

            # Run migrations
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" compose run --rm web \
              python manage.py migrate --noinput

            # Collect static files
            VENEPHETH_IMAGE="$VENEPHETH_IMAGE" compose run --rm web \
              python manage.py collectstatic --noinput

            # Standalone Docker Compose runs one web container; replacing it
            # causes a short interruption (this is not a Swarm rolling update).
            old_id=$(compose ps -q web)
            previous_image=""
            if [ -n "$old_id" ]; then
              previous_image=$(docker inspect --format '{{.Config.Image}}' "$old_id")
            fi
            deploy_started=1
            if ! VENEPHETH_IMAGE="$VENEPHETH_IMAGE" compose up -d --no-deps --force-recreate web celery celery-beat; then
              echo "❌  Compose failed while recreating application services"
              deploy_started=0
            fi

            # Poll the container healthcheck. The web port is intentionally not
            # published on the host; Nginx is the public entry point.
            echo "Waiting for the app container to become healthy..."
            healthy=0
            if [ "$deploy_started" -eq 1 ]; then
              for attempt in $(seq 1 30); do
                new_id=$(compose ps -q web)
                health="missing"
                if [ -n "$new_id" ]; then
                  health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$new_id" 2>/dev/null || echo "missing")
                fi
                if [ "$health" = "healthy" ]; then
                  echo "✅  App healthy after ${attempt} attempt(s)"
                  healthy=1
                  break
                fi
                sleep 5
              done
            fi
            if [ "$healthy" -ne 1 ]; then
              echo "❌  Health check never passed"
              compose logs --tail=100 web
              if [ -n "$previous_image" ]; then
                echo "Attempting application rollback to ${previous_image}"
                if VENEPHETH_IMAGE="$previous_image" compose up -d --no-deps --force-recreate web celery celery-beat; then
                  rollback_healthy=0
                  for attempt in $(seq 1 30); do
                    rollback_id=$(compose ps -q web)
                    rollback_health="missing"
                    if [ -n "$rollback_id" ]; then
                      rollback_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$rollback_id" 2>/dev/null || echo "missing")
                    fi
                    if [ "$rollback_health" = "healthy" ]; then
                      echo "✅  Previous application image is healthy after rollback."
                      rollback_healthy=1
                      break
                    fi
                    sleep 5
                  done
                  if [ "$rollback_healthy" -ne 1 ]; then
                    echo "❌  Previous image was started but did not become healthy."
                  fi
                  echo "Database migrations are not automatically reversed."
                else
                  echo "❌  Application rollback failed; manual recovery is required."
                fi
              else
                echo "No previous web image was running; automatic rollback is unavailable."
              fi
              exit 1
            fi

            # The Tunnel terminates public TLS; Nginx serves HTTP only on the
            # host loopback origin and has no Let's Encrypt certificate.
            compose up -d --force-recreate nginx

            echo "✅ Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "🚨 Deployment failed for ${{ github.sha }}. Check logs."
